<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventist Player | Siente la Música</title>
    <meta name="description" content="Bienvenido a Adventist Player, tu plataforma de streaming favorita con los mejores hits del momento.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <!-- Hls.js for HLS streams (.m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="o-app-layout">
        <!-- Sidebar -->
        <aside class="c-sidebar" id="sidebar">
            <div class="c-logo">
                <img src="/assets/logo.png" alt="Logo Adventist Player" width="175px">
            </div>
            <nav>
                <ul class="c-nav-list">
                    <li class="c-nav-item is-active" id="nav-home">
                        <ion-icon name="home-outline"></ion-icon>
                        <span>Inicio</span>
                    </li>
                </ul>
            </nav>
            <nav class="u-margin-auto-top">
                <ul class="c-nav-list">
                    <li class="c-nav-item">
                        <ion-icon name="add-circle-outline"></ion-icon>
                        <span>Crear lista</span>
                    </li>
                    <li class="c-nav-item" id="nav-favorites-sidebar">
                        <ion-icon name="heart-outline"></ion-icon>
                        <span>Tus me gusta</span>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="c-main-content" id="main-content">
            <header class="c-app-header" id="header">
                <!-- Search Bar -->
                <div class="c-search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" id="station-search" placeholder="¿Qué quieres escuchar?">
                </div>
            </header>

            <section class="c-hero" id="hero-section">
                <div class="c-hero__content">
                    <small class="c-hero__label u-letter-spacing">Señal Original</small>
                    <h1 class="c-hero__title" id="hero-title">Red Nuevo Tiempo</h1>
                    <div class="c-hero__actions">
                        <button class="c-button c-button--primary" id="hero-play-btn">Escuchar Ahora</button>
                        <button class="c-button c-button--outline u-margin-left-12" id="hero-fav-btn"><ion-icon name="heart-outline"></ion-icon></button>
                    </div>
                </div>
            </section>

            <!-- Favorites Section (Hidden by default) -->
            <section class="u-padding-32" id="favorites-section" style="display: none;">
                <h2 class="c-section-title">Tus Favoritos</h2>
                <div class="o-main-grid" id="favorites-grid">
                    <!-- Fav cards injected by JS -->
                </div>
            </section>

            <section class="u-padding-32" id="all-stations-section">
                <h2 class="c-section-title" id="all-stations-title">Todas las Radios</h2>
                
                <!-- Language Filters -->
                <div class="c-filter-group" id="language-filters">
                    <!-- Chips injected by JS -->
                </div>

                <div class="o-main-grid" id="all-stations-grid">
                    <p class="u-text-muted">Cargando estaciones...</p>
                </div>
            </section>
        </main>

        <!-- Player Bar -->
        <footer class="c-player-bar">
            <audio id="audio-player"></audio>

            <div class="c-player-bar__now-playing">
                <div class="c-player-bar__mini-cover" id="current-cover"></div>
                <div class="c-player-bar__track-info">
                    <h4 class="u-font-small u-font-bold u-margin-0" id="current-title">Selecciona una radio</h4>
                    <p class="u-font-small u-text-muted u-margin-0" id="current-artist">Artista</p>
                </div>
                <button class="c-icon-button u-margin-left-10" id="player-fav-btn"><ion-icon name="heart-outline"></ion-icon></button>
            </div>

            <div class="c-player-bar__controls">
                <div class="c-control-buttons">
                    <button class="c-icon-button"><ion-icon name="shuffle-outline"></ion-icon></button>
                    <button class="c-icon-button"><ion-icon name="play-skip-back"></ion-icon></button>
                    <button class="c-icon-button c-icon-button--large is-playing-trigger" id="main-play-toggle">
                        <ion-icon name="play-circle"></ion-icon>
                    </button>
                    <button class="c-icon-button"><ion-icon name="play-skip-forward"></ion-icon></button>
                    <button class="c-icon-button"><ion-icon name="repeat-outline"></ion-icon></button>
                </div>
                <div class="c-playback-bar">
                    <span id="current-time">0:00</span>
                    <div class="c-progress-bar" id="progress-container">
                        <div class="c-progress-bar__fill" id="progress-fill"></div>
                    </div>
                    <span id="duration">Live</span>
                </div>
            </div>

            <div class="c-volume-controls">
                <ion-icon name="mic-outline"></ion-icon>
                <ion-icon name="list-outline"></ion-icon>
                <ion-icon name="volume-medium-outline"></ion-icon>
                <div class="c-volume-bar">
                    <div class="c-volume-bar__fill" style="width: 70%;"></div>
                </div>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
