<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Adventist Player | Redirecting...</title>
    <script>
        const ISO_LANG_MAP = {
            'es': 'es',
            'en': 'en',
            'pt': 'pt'
        };

        function getRedirectLanguage() {
            // 1. Check browser language (no longer using localStorage)
            const browserLang = navigator.language.split('-')[0].toLowerCase();
            return ISO_LANG_MAP[browserLang] || 'es';
        }

        const targetLang = getRedirectLanguage();
        window.location.replace('/' + targetLang + '/' + window.location.search);
    </script>
</head>
<body>
    <p>Redirecting to <a id="redirect-link" href="/es/">Adventist Player</a>...</p>
    <script>
        document.getElementById('redirect-link').href = '/' + targetLang + '/';
        document.getElementById('redirect-link').innerText = 'Adventist Player (' + targetLang + ')';
    </script>
</body>
</html>
